{% extends "base.html" %}

{% block content %}
<div class="form-card small">
    <h2>User Register</h2>

    <form method="POST">
        <label>Full Name</label>
        <input type="text" name="name" placeholder="Enter full name" required>

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter email" required>

        <label>Phone Number</label>
        <input type="text" name="phone" placeholder="10 digit mobile number" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Create password" required>

        <button class="btn primary full" type="submit">Send OTP</button>
    </form>

    <p class="hint">Already registered? <a href="{{ url_for('user_login') }}">Login here</a></p>
</div>
{% endblock %}

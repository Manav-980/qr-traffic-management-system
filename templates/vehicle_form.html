{% extends "base.html" %}{% block content %}<div class="form-card"><div class="form-header"><div><p class="eyebrow">Vehicle Form</p><h1>{{ title }}</h1><p>Enter vehicle and owner information carefully.</p></div><div class="form-icon">🚘</div></div><form method="POST" action="{{ action }}" class="vehicle-form"><div class="input-group"><label>Vehicle Number</label><input type="text" name="vehicle_no" placeholder="UK07AB1234" value="{{ vehicle.vehicle_no if vehicle else '' }}" required></div><div class="input-group"><label>Owner Name</label><input type="text" name="owner_name" placeholder="Enter owner name" value="{{ vehicle.owner_name if vehicle else '' }}" required></div><div class="input-group"><label>Phone Number</label><input type="text" name="phone" placeholder="Enter phone number" value="{{ vehicle.phone if vehicle else '' }}" required></div><div class="input-group"><label>Vehicle Type</label><select name="vehicle_type" required><option value="">Select Vehicle Type</option>{% for type in ['Car','Bike','Scooter','Truck','Bus','Other'] %}<option value="{{ type }}" {% if vehicle and vehicle.vehicle_type == type %}selected{% endif %}>{{ type }}</option>{% endfor %}</select></div><div class="input-group full"><label>Address</label><textarea name="address" placeholder="Enter address">{{ vehicle.address if vehicle else '' }}</textarea></div><div class="form-actions full"><button type="submit" class="save-btn">Save Vehicle</button><a href="javascript:history.back()" class="cancel-btn">Cancel</a></div></form></div>{% endblock %}

{% extends "base.html" %}{% block content %}<div class="page-title-row"><div><p class="eyebrow">Registered Users</p><h1>Users</h1></div><a href="{{ url_for('admin_dashboard') }}" class="btn secondary">Back</a></div><div class="card"><div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Created At</th></tr></thead><tbody>{% for u in users %}<tr><td>{{ u.id }}</td><td>{{ u.name }}</td><td>{{ u.email }}</td><td>{{ u.created_at }}</td></tr>{% else %}<tr><td colspan="4" class="empty">No users found.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}

{% extends 'base.html' %}{% block content %}
<h1>Users List</h1>
<div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Vehicles</th><th>Created</th></tr></thead><tbody>
{% for u in users %}<tr><td>{{u.id}}</td><td>{{u.name}}</td><td>{{u.email}}</td><td>{{u.phone}}</td><td>{{u.vehicle_count}}</td><td>{{u.created_at}}</td></tr>{% else %}<tr><td colspan="6">No users found.</td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}

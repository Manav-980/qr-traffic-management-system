<div class="table-wrap"><table>
<thead><tr><th>ID</th><th>Vehicle No</th><th>Owner</th><th>Phone</th><th>Type</th><th>QR</th><th>Action</th></tr></thead>
<tbody>
{% for v in vehicles or latest %}
<tr>
<td>{{ v.id }}</td><td>{{ v.vehicle_no }}</td><td>{{ v.owner_name }}</td><td>{{ v.phone }}</td><td>{{ v.vehicle_type }}</td>
<td><a class="small" href="{{ url_for('download_qr', vehicle_id=v.id) }}">Download QR</a></td>
<td><a class="small" href="{{ url_for('admin_edit_vehicle', vehicle_id=v.id) }}">Edit</a> <a class="small danger-link" onclick="return confirm('Delete vehicle?')" href="{{ url_for('admin_delete_vehicle', vehicle_id=v.id) }}">Delete</a></td>
</tr>
{% else %}<tr><td colspan="7">No vehicles found.</td></tr>{% endfor %}
</tbody></table></div>
